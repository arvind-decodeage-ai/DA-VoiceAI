[project]
name = "da-voice"
version = "0.1.0"
description = "Decode Age Customer Support Voice Agent — Desktop Prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[sarvam,openai,silero,turn-detector]",
    "fastapi",
    "openai",
    "psycopg[binary]",
    "pydantic",
    "pydantic-settings",
    "redis",
    "uvicorn[standard]",
    "langfuse",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "api", "db"]
